<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0a0c0f; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", sans-serif;
    gap: 18px;
  }
  .mark {
    width: 40px;
    height: 40px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 6px;
  }
  .mark div {
    background: #ffb03a;
    border-radius: 6px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .mark div:nth-child(2) { opacity: 0.4; animation-delay: 0.15s; }
  .mark div:nth-child(3) { opacity: 0.4; animation-delay: 0.3s; }
  .mark div:nth-child(4) { opacity: 0.7; animation-delay: 0.45s; }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .msg {
    font-family: "DM Mono", monospace;
    font-size: 13px;
    color: #56627a;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="mark">
    <div></div><div></div><div></div><div></div>
  </div>
  <div class="msg">reconnecting&hellip;</div>
</body>
</html>
